<!-- Cookie Settings Card with Switches -->
<div class="card">
    <header>
        <h2>Cookie Settings</h2>
        <p>Manage your cookie settings here.</p>
    </header>
    <section class="grid gap-6">
        <div role="group" class="field" data-orientation="horizontal">
            <section>
                <label for="cookie-necessary">Strictly Necessary</label>
                <p>These cookies are essential in order to use the website and use its features.</p>
            </section>
            <input type="checkbox" id="cookie-necessary" role="switch" class="input" checked />
        </div>
        <div role="group" class="field" data-orientation="horizontal">
            <section>
                <label for="cookie-functional">Functional Cookies</label>
                <p>These cookies allow the website to provide personalized functionality.</p>
            </section>
            <input type="checkbox" id="cookie-functional" role="switch" class="input" />
        </div>
        <div role="group" class="field" data-orientation="horizontal">
            <section>
                <label for="cookie-performance">Performance Cookies</label>
                <p>These cookies help to improve the performance of the website.</p>
            </section>
            <input type="checkbox" id="cookie-performance" role="switch" class="input" />
        </div>
    </section>
    <footer>
        <button type="button" class="btn w-full" data-variant="outline">Save preferences</button>
    </footer>
</div>
