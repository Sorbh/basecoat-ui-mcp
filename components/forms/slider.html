<!-- Range Slider with Label and Value (range.js keeps the filled track in sync) -->
<div class="grid w-full gap-1 max-w-sm">
  <div class="flex items-center justify-between gap-2">
    <label class="label" for="volume">Volume</label>
    <output class="text-sm text-muted-foreground" for="volume">50</output>
  </div>
  <input
    id="volume"
    type="range"
    class="input w-full"
    min="0"
    max="100"
    value="50"
    oninput="this.previousElementSibling.querySelector('output').value = this.value"
  />
</div>
