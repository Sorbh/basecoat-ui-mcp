<!-- Radio Group with Fieldset and Legend -->
<fieldset class="fieldset">
  <legend data-variant="label">Choose display mode</legend>
  <div role="radiogroup" aria-label="Display mode" data-slot="radio-group">
    <div role="group" class="field" data-orientation="horizontal">
      <input type="radio" id="display-comfortable" name="display-mode" value="comfortable" class="input" checked />
      <label for="display-comfortable" class="font-normal">Comfortable</label>
    </div>
    <div role="group" class="field" data-orientation="horizontal">
      <input type="radio" id="display-compact" name="display-mode" value="compact" class="input" />
      <label for="display-compact" class="font-normal">Compact</label>
    </div>
    <div role="group" class="field" data-orientation="horizontal">
      <input type="radio" id="display-spacious" name="display-mode" value="spacious" class="input" />
      <label for="display-spacious" class="font-normal">Spacious</label>
    </div>
  </div>
</fieldset>
