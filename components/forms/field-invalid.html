<!-- Invalid Field: data-invalid on .field, aria-invalid on the control, error <p role="alert"> -->
<div role="group" class="field" data-invalid>
  <label for="field-invalid-email">Email</label>
  <input id="field-invalid-email" type="email" value="wrong-email" aria-invalid="true" aria-describedby="field-invalid-email-error" />
  <p id="field-invalid-email-error" role="alert">Enter a valid email address.</p>
</div>
