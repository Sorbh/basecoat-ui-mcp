<!-- Profile Avatar (image first, fallback <span> second) -->
<span class="avatar">
  <img src="https://github.com/shadcn.png" alt="User avatar" />
  <span>JD</span>
</span>

<!-- Different Sizes -->
<span class="avatar" data-size="sm"><img src="https://github.com/shadcn.png" alt="Small avatar" /><span>JD</span></span>
<span class="avatar"><img src="https://github.com/shadcn.png" alt="Medium avatar" /><span>JD</span></span>
<span class="avatar" data-size="lg"><img src="https://github.com/shadcn.png" alt="Large avatar" /><span>JD</span></span>

<!-- Avatar with Fallback -->
<span class="avatar"><span>JD</span></span>

<!-- Avatar with Status Badge -->
<span class="avatar">
  <img src="https://github.com/shadcn.png" alt="User avatar" />
  <span>JD</span>
  <span class="avatar-badge bg-green-600 dark:bg-green-800"></span>
</span>

<!-- Avatar Group with Count -->
<div class="avatar-group">
  <span class="avatar"><img src="https://github.com/shadcn.png" alt="Jane Doe" /><span>JD</span></span>
  <span class="avatar"><img src="https://github.com/maxleiter.png" alt="Max Lee" /><span>ML</span></span>
  <span class="avatar"><img src="https://github.com/evilrabbit.png" alt="Eve Rabbit" /><span>ER</span></span>
  <span data-count>+3</span>
</div>
