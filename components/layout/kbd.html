<!-- Kbd: keyboard key labels using <kbd class="kbd">; group multiple keys with an inline-flex wrapper. CSS only, no JS. -->
<div class="flex flex-col items-center gap-4">
  <span class="inline-flex items-center gap-1">
    <kbd class="kbd">⌘</kbd>
    <kbd class="kbd">⇧</kbd>
    <kbd class="kbd">⌥</kbd>
    <kbd class="kbd">⌃</kbd>
  </span>
  <span class="inline-flex items-center gap-1">
    <kbd class="kbd">Ctrl</kbd>
    <span>+</span>
    <kbd class="kbd">B</kbd>
  </span>
</div>
