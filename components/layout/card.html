<!-- Basic Card Structure -->
<div class="card">
  <header>
    <h2>Card Title</h2>
    <p>Card description</p>
    <div class="card-action">
      <button type="button" class="btn" data-variant="link">Action</button>
    </div>
  </header>
  <section>
    <p>Card content goes here.</p>
  </section>
  <footer>
    <button type="button" class="btn">Action</button>
  </footer>
</div>

<!-- Small Card (denser spacing) -->
<div class="card" data-size="sm">
  <header>
    <h2>Small Card</h2>
    <p>This card uses the small size variant.</p>
  </header>
  <section>
    <p>Compact content.</p>
  </section>
</div>

<!-- Card with Image -->
<div class="card">
  <img alt="Cover image" class="aspect-video w-full object-cover" src="/path/to/cover.jpg" />
  <header>
    <h2>Card Title</h2>
    <p>Subtitle</p>
    <div class="card-action">
      <span class="badge" data-variant="secondary">Featured</span>
    </div>
  </header>
  <footer class="gap-2">
    <button type="button" class="btn" data-variant="outline">Cancel</button>
    <button type="button" class="btn">Confirm</button>
  </footer>
</div>
